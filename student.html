<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Student Experiment Portal</title>

<script src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
*{box-sizing:border-box;}
body{
  font-family:Arial;
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  color:white;
  text-align:center;
  margin:0;
  min-height:100vh;
  overflow:hidden;
}
.container{width:100%;max-width:100vw;margin:auto;padding:4px 8px;}
h2{margin:4px 0;font-size:20px;}
h3{margin:4px 0;font-size:17px;}
p{margin:5px 0;}
.card{
  background:rgba(255,255,255,0.1);
  padding:6px 10px;
  border-radius:12px;
  margin-top:4px;
}
input,select{
  height:34px;
  padding:5px 8px;
  margin:3px;
  width:330px;
  max-width:90vw;
  border:none;
  border-radius:6px;
  font-size:15px;
}
button{
  padding:7px 14px;
  margin:3px;
  border:none;
  border-radius:6px;
  background:#00c6ff;
  color:white;
  font-weight:bold;
  cursor:pointer;
  font-size:15px;
}
#experimentCard{display:none;}
#timer{font-size:20px;margin:4px 0;}
#indicator{
  width:14px;
  height:14px;
  border-radius:50%;
  background:red;
  margin:3px auto;
}
.metricBox{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  width:75vw;
  max-width:1050px;
  gap:6px;
  margin:5px auto;
}
.metric{
  background:rgba(0,0,0,0.18);
  padding:5px;
  border-radius:8px;
  font-size:13px;
}
#wrap{
  position:relative;
  display:inline-block;
  height:52vh;
  width:auto;
  max-width:82vw;
  aspect-ratio:4/3;
  margin-top:2px;
}
video,canvas{
  width:100%;
  height:100%;
  border-radius:10px;
  object-fit:cover;
}
canvas{
  position:absolute;
  top:0;
  left:0;
}
#status{font-size:13px;margin:4px 0;}
@media (max-height:760px){
  #wrap{height:45vh;max-width:78vw;}
  h2{font-size:18px;}
  h3{font-size:15px;}
  #timer{font-size:17px;}
  .metric{font-size:12px;padding:4px;}
}
@media (max-width:700px){
  body{overflow:auto;}
  #wrap{width:94vw;height:auto;max-width:94vw;}
  .metricBox{grid-template-columns:repeat(2,1fr);width:94vw;}
}
</style>
</head>

<body>

<div class="container">

<h2>Student Experiment Portal</h2>

<div class="card" id="loginCard">
  <h3>Request Experiment Access</h3>
  <input id="name" placeholder="Student Name"><br>
  <input id="email" placeholder="Gmail ID"><br>
  <button onclick="requestPermission()">Request Permission</button>
  <p id="msg"></p>
</div>

<div class="card" id="experimentCard">
  <h3>Pupil Tracking Experiment</h3>

  <input id="sid" placeholder="Enter Student ID"><br>

  <select id="lightingCondition">
    <option value="Normal Room Lighting">Normal Room Lighting</option>
    <option value="Daytime Indoor Lighting">Daytime Indoor Lighting</option>
    <option value="Low Lighting">Low Lighting</option>
    <option value="Bright Lighting">Bright Lighting</option>
  </select><br>

  <button onclick="startSession()">Start Experiment</button>

  <p id="timer">Time Remaining: 31:00</p>

  <div id="indicator"></div>

  <div class="metricBox">
    <div class="metric">FPS: <span id="fpsView">0</span></div>
    <div class="metric">Latency: <span id="latencyView">0</span> ms</div>
    <div class="metric">Detection: <span id="detectView">Waiting</span></div>
    <div class="metric">Engagement: <span id="engageView">Waiting</span></div>
  </div>

  <div id="wrap">
    <video id="video" width="960" height="720" autoplay muted></video>
    <canvas id="canvas" width="960" height="720"></canvas>
  </div>

  <p id="status">Waiting for session</p>
</div>

</div>

<script>


/************************************************************
 STUDENT PERMISSION REQUEST
************************************************************/
function requestPermission(){
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();

  if(name === "" || email === ""){
    alert("Enter Name and Gmail");
    return;
  }

  const id = email.replace(/\./g,"_");

  db.ref("studentRequests/" + id).set({
    name: name,
    email: email,
    status: "pending",
    request_timestamp: Date.now()
  }).then(()=>{
    document.getElementById("msg").innerText =
      "Request sent to teacher. Waiting for approval...";
    checkApproval(id);
  }).catch(error=>{
    console.error("Firebase error:", error);
    alert("Error sending request");
  });
}

function checkApproval(id){
  db.ref("studentRequests/" + id + "/status").on("value", snap=>{
    const status = snap.val();

    if(status === "approved"){
      document.getElementById("loginCard").style.display = "none";
      document.getElementById("experimentCard").style.display = "block";
      document.getElementById("status").innerText =
        "Access Approved. Click Start Experiment to begin.";
    }

    if(status === "rejected"){
      document.getElementById("msg").innerText =
        "Teacher rejected your request.";
    }
  });
}

/************************************************************
 EXPERIMENT VARIABLES
************************************************************/
let sessionActive = false;
let studentId = null;
let sessionId = null;
let startTime = null;

const BASELINE_DURATION = 60;       // 60 seconds baseline
const LECTURE_DURATION = 1800;      // 30 minutes lecture
const SESSION_DURATION = 1860;      // 31 minutes total

const BLINK_TOLERANCE_MS = 1200;
const SMOOTH_FACTOR = 0.95;
const CHANGE_THRESHOLD = 0.7;

// Change this for sensitivity analysis: 1.25
const ENGAGEMENT_THRESHOLD = 1.25;

let samples = [];
let baseline = null;
let calibrated = false;
let ratioBuffer = [];
let smoothRatio = null;
let displayedChange = 0;
let lastSent = 0;
let lastValidData = null;
let lastDetectionTime = 0;
let camInstance = null;

let frameCounter = 0;
let lastFpsTime = Date.now();
let fpsValue = 0;
let previousFrameTime = Date.now();

/************************************************************
 START SESSION
************************************************************/
function startSession(){
  studentId = document.getElementById("sid").value.trim();

  if(!studentId){
    alert("Enter Student ID");
    return;
  }

  sessionActive = true;
  sessionId = "S" + Date.now();
  startTime = Date.now();

  samples = [];
  baseline = null;
  calibrated = false;
  ratioBuffer = [];
  smoothRatio = null;
  displayedChange = 0;
  lastValidData = null;
  lastDetectionTime = 0;
  frameCounter = 0;
  lastFpsTime = Date.now();
  previousFrameTime = Date.now();

  document.getElementById("status").innerText =
    "Starting camera and 60-second baseline calibration...";

  startCamera();
}

/************************************************************
 HELPER FUNCTIONS
************************************************************/
function updateFPS(){
  frameCounter++;
  const now = Date.now();

  if(now - lastFpsTime >= 1000){
    fpsValue = frameCounter;
    frameCounter = 0;
    lastFpsTime = now;
    document.getElementById("fpsView").innerText = fpsValue;
  }
}

function getFrameDrop(){
  const now = Date.now();
  const gap = now - previousFrameTime;
  previousFrameTime = now;
  return gap > 250;
}

function engagementStatus(changePercent){
  if(!calibrated) return "Calibrating";

  return changePercent >= ENGAGEMENT_THRESHOLD
    ? "Engaged"
    : "Less Engaged";
}

function sendFirebaseRecord(record){
  db.ref("pupilData/" + studentId + "/" + Date.now()).set(record);
}

/************************************************************
 CAMERA + MEDIAPIPE + OPENCV PUPIL TRACKING
************************************************************/
function startCamera(){
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const indicator = document.getElementById("indicator");

  navigator.mediaDevices.getUserMedia({ video:true })
  .then(stream=>{
    video.srcObject = stream;

    const faceMesh = new FaceMesh({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(results=>{
      if(!sessionActive) return;

      const frameStart = performance.now();
      updateFPS();
      const frameDrop = getFrameDrop();

      let detectionStatus = "Not Detected";
      let blinkEvent = false;
      let currentEngagement = "Waiting";
      let latencyValue = 0;

      try{
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(results.image,0,0,canvas.width,canvas.height);

        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const remaining = SESSION_DURATION - elapsed;
        const lectureTimeSec = Math.max(0, elapsed - BASELINE_DURATION);

        if(remaining <= 0){
          sessionActive = false;

          if(video.srcObject){
            video.srcObject.getTracks().forEach(t=>t.stop());
          }

          document.getElementById("status").innerText = "Session Completed";
          document.getElementById("timer").innerText = "Time Remaining: 00:00";
          return;
        }

        const m = String(Math.floor(remaining / 60)).padStart(2,'0');
        const s = String(remaining % 60).padStart(2,'0');
        document.getElementById("timer").innerText =
          `Time Remaining: ${m}:${s}`;

        if(!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0){

          if(Date.now() - lastDetectionTime < BLINK_TOLERANCE_MS && lastValidData){
            blinkEvent = true;
            detectionStatus = "Blink Tolerance";
            useLastData();
          } else {
            indicator.style.background = "red";
            detectionStatus = "Face Not Detected";
            document.getElementById("status").innerText = "Face not detected...";
          }

          latencyValue = Math.round(performance.now() - frameStart);
          updateMetricViews(latencyValue,detectionStatus,currentEngagement);

          if(Date.now() - lastSent > 1000){
            lastSent = Date.now();

            sendFirebaseRecord({
              sessionId,
              studentId,
              timestamp: Date.now(),
              readable_time: new Date().toLocaleString(),
              session_time_sec: elapsed,
              lecture_time_sec: lectureTimeSec,
              timeRemaining: remaining,
              fps: fpsValue,
              processing_latency_ms: latencyValue,
              detection_status: detectionStatus,
              blink_event: blinkEvent,
              frame_drop: frameDrop,
              lighting_condition: document.getElementById("lightingCondition").value,
              normalizedRatio: null,
              baseline: baseline,
              changePercent: null,
              engagement_threshold_percent: ENGAGEMENT_THRESHOLD,
              engagement_status: "Not Available"
            });
          }

          return;
        }

        const lm = results.multiFaceLandmarks[0];

        const left = [468,469,470,471,472];
        const right = [473,474,475,476,477];

        function irisData(ids){
          const xs = [];
          const ys = [];

          ids.forEach(i=>{
            if(lm[i]){
              xs.push(lm[i].x * canvas.width);
              ys.push(lm[i].y * canvas.height);
            }
          });

          if(xs.length < 3) return null;

          const cx = xs.reduce((a,b)=>a+b) / xs.length;
          const cy = ys.reduce((a,b)=>a+b) / ys.length;
          const r = (Math.max(...xs) - Math.min(...xs)) / 2;

          return {cx,cy,r};
        }

        function detectPupil(data){
          if(!data || !data.r) return null;

          const size = Math.round(data.r * 4.4);

          if(size < 24){
            return {
              r: data.r * 0.22,
              cx: data.cx,
              cy: data.cy,
              fallback: true
            };
          }

          const x = Math.max(
            0,
            Math.min(canvas.width - size, Math.round(data.cx - size / 2))
          );

          const y = Math.max(
            0,
            Math.min(canvas.height - size, Math.round(data.cy - size / 2))
          );

          const src = cv.imread(canvas);
          const roi = src.roi(new cv.Rect(x, y, size, size));

          const gray = new cv.Mat();
          cv.cvtColor(roi, gray, cv.COLOR_RGBA2GRAY);

          const clahe = new cv.CLAHE(1.5, new cv.Size(8,8));
          clahe.apply(gray, gray);

          cv.GaussianBlur(gray, gray, new cv.Size(3,3), 0);

          const darkThresh = new cv.Mat();
          const adaptive = new cv.Mat();
          const combined = new cv.Mat();

          cv.threshold(gray, darkThresh, 65, 255, cv.THRESH_BINARY_INV);

          cv.adaptiveThreshold(
            gray,
            adaptive,
            255,
            cv.ADAPTIVE_THRESH_GAUSSIAN_C,
            cv.THRESH_BINARY_INV,
            21,
            4
          );

          cv.bitwise_or(darkThresh, adaptive, combined);

          const kernel = cv.Mat.ones(2, 2, cv.CV_8U);
          cv.morphologyEx(combined, combined, cv.MORPH_CLOSE, kernel);

          const contours = new cv.MatVector();
          const hier = new cv.Mat();

          cv.findContours(
            combined,
            contours,
            hier,
            cv.RETR_EXTERNAL,
            cv.CHAIN_APPROX_SIMPLE
          );

          let best = null;
          let bestScore = -Infinity;

          for(let i=0; i<contours.size(); i++){
            const cnt = contours.get(i);
            const area = cv.contourArea(cnt);

            if(area > 5){
              const circle = cv.minEnclosingCircle(cnt);

              const globalCx = circle.center.x + x;
              const globalCy = circle.center.y + y;

              const dx = globalCx - data.cx;
              const dy = globalCy - data.cy;
              const dist = Math.sqrt(dx*dx + dy*dy);

              const validRadius =
                circle.radius > data.r * 0.06 &&
                circle.radius < data.r * 0.55;

              const nearCenter = dist < data.r * 1.25;

              const validArea =
                area > data.r * data.r * 0.01 &&
                area < data.r * data.r * 6.0;

              if(validRadius && nearCenter && validArea){
                const score = area - dist * 1.5;

                if(score > bestScore){
                  bestScore = score;
                  best = {
                    r: circle.radius,
                    cx: globalCx,
                    cy: globalCy,
                    fallback: false
                  };
                }
              }
            }

            cnt.delete();
          }

          roi.delete();
          gray.delete();
          darkThresh.delete();
          adaptive.delete();
          combined.delete();
          kernel.delete();
          contours.delete();
          hier.delete();
          src.delete();

          if(!best){
            best = {
              r: data.r * 0.18,
              cx: data.cx,
              cy: data.cy,
              fallback: true
            };
          }

          return best;
        }

        function drawCross(cx,cy,size=5,color="lime"){
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(cx-size,cy);
          ctx.lineTo(cx+size,cy);
          ctx.moveTo(cx,cy-size);
          ctx.lineTo(cx,cy+size);
          ctx.stroke();
        }

        function processEye(ids){
          const iris = irisData(ids);
          if(!iris) return null;

          ctx.beginPath();
          ctx.arc(iris.cx, iris.cy, iris.r + 2, 0, 2*Math.PI);
          ctx.strokeStyle = "yellow";
          ctx.lineWidth = 2;
          ctx.stroke();

          const pupil = detectPupil({...iris});

          if(pupil){
            const pupilColor = pupil.fallback ? "cyan" : "lime";

            ctx.beginPath();
            ctx.arc(pupil.cx, pupil.cy, pupil.r, 0, 2*Math.PI);
            ctx.strokeStyle = pupilColor;
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = pupil.fallback
              ? "rgba(0,255,255,0.20)"
              : "rgba(0,255,0,0.25)";

            ctx.beginPath();
            ctx.arc(pupil.cx, pupil.cy, pupil.r, 0, 2*Math.PI);
            ctx.fill();

            drawCross(pupil.cx,pupil.cy,5,pupilColor);
          }

          return {iris,pupil};
        }

        const L = processEye(left);
        const R = processEye(right);

        const eyesDetected = L && L.pupil && R && R.pupil;

        if(eyesDetected){
          indicator.style.background = "limegreen";
          detectionStatus = "Detected";

          let ratio = ((L.pupil.r / L.iris.r) + (R.pupil.r / R.iris.r)) / 2;

          if(smoothRatio === null) smoothRatio = ratio;

          smoothRatio =
            SMOOTH_FACTOR * smoothRatio + (1 - SMOOTH_FACTOR) * ratio;

          ratioBuffer.push(smoothRatio);

          if(ratioBuffer.length > 10){
            ratioBuffer.shift();
          }

          const avgRatio =
            ratioBuffer.reduce((a,b)=>a+b) / ratioBuffer.length;

          /************************************************************
           60-SECOND BASELINE CALIBRATION
          ************************************************************/
          if(!calibrated && elapsed <= BASELINE_DURATION){
            samples.push(avgRatio);

            document.getElementById("status").innerText =
              `Baseline calibration running: ${BASELINE_DURATION - elapsed} sec remaining`;
          }

          if(!calibrated && elapsed > BASELINE_DURATION && samples.length > 0){
            baseline = samples.reduce((a,b)=>a+b) / samples.length;
            calibrated = true;

            document.getElementById("status").innerText =
              "Baseline calibration completed. Engagement tracking started.";
          }

          let change = calibrated
            ? ((avgRatio - baseline) / baseline) * 100
            : 0;

          if(Math.abs(change) < CHANGE_THRESHOLD){
            change = 0;
          }

          displayedChange =
            0.9 * displayedChange + 0.1 * change;

          currentEngagement = engagementStatus(displayedChange);

          if(calibrated){
            document.getElementById("status").innerText =
              `Normalized Ratio: ${avgRatio.toFixed(3)} | Baseline: ${baseline.toFixed(3)} | Change: ${displayedChange.toFixed(2)} %`;
          }

          lastValidData = {
            ratio: avgRatio,
            baseline: baseline,
            change: displayedChange,
            remaining: remaining
          };

          lastDetectionTime = Date.now();

          latencyValue = Math.round(performance.now() - frameStart);
          updateMetricViews(latencyValue,detectionStatus,currentEngagement);

          if(Date.now() - lastSent > 1000){
            lastSent = Date.now();

            sendFirebaseRecord({
              sessionId,
              studentId,
              timestamp: Date.now(),
              readable_time: new Date().toLocaleString(),
              session_time_sec: elapsed,
              lecture_time_sec: lectureTimeSec,
              timeRemaining: remaining,

              fps: fpsValue,
              processing_latency_ms: latencyValue,
              detection_status: detectionStatus,
              blink_event: false,
              frame_drop: frameDrop,
              lighting_condition: document.getElementById("lightingCondition").value,

              normalizedRatio: avgRatio,
              baseline: baseline,
              changePercent: calibrated ? displayedChange : null,
              engagement_threshold_percent: ENGAGEMENT_THRESHOLD,
              engagement_status: calibrated ? currentEngagement : "Calibrating"
            });
          }

        } else {

          if(Date.now() - lastDetectionTime < BLINK_TOLERANCE_MS && lastValidData){
            blinkEvent = true;
            detectionStatus = "Blink Tolerance";
            useLastData();
          } else {
            indicator.style.background = "red";
            detectionStatus = "Eyes/Pupil Not Detected";
            document.getElementById("status").innerText =
              "Eyes or pupil not detected...";
          }

          latencyValue = Math.round(performance.now() - frameStart);
          updateMetricViews(latencyValue,detectionStatus,"Not Available");

          if(Date.now() - lastSent > 1000){
            lastSent = Date.now();

            sendFirebaseRecord({
              sessionId,
              studentId,
              timestamp: Date.now(),
              readable_time: new Date().toLocaleString(),
              session_time_sec: elapsed,
              lecture_time_sec: lectureTimeSec,
              timeRemaining: remaining,

              fps: fpsValue,
              processing_latency_ms: latencyValue,
              detection_status: detectionStatus,
              blink_event: blinkEvent,
              frame_drop: frameDrop,
              lighting_condition: document.getElementById("lightingCondition").value,

              normalizedRatio: null,
              baseline: baseline,
              changePercent: null,
              engagement_threshold_percent: ENGAGEMENT_THRESHOLD,
              engagement_status: "Not Available"
            });
          }
        }

      } catch(e){
        console.error(e);
      }

      function useLastData(){
        indicator.style.background = "limegreen";
        currentEngagement = engagementStatus(displayedChange);

        document.getElementById("status").innerText =
          `Blink tolerance active | Last Change: ${displayedChange.toFixed(2)} %`;
      }

      function updateMetricViews(latency,detection,engagement){
        document.getElementById("latencyView").innerText = latency;
        document.getElementById("detectView").innerText = detection;
        document.getElementById("engageView").innerText = engagement;
      }

    });

    camInstance = new Camera(video,{
      onFrame: async()=> await faceMesh.send({image:video}),
      width:960,
      height:720
    });

    camInstance.start();

  }).catch(err=>{
    alert("Camera permission required");
    console.error(err);
  });
}

</script>
</body>
</html>
